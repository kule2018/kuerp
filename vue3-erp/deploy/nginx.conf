# ============================================================================
# 进销存 ERP 前端 Nginx 配置
#
# 两个职责：
#   1) 托管 Vue3 SPA（history 路由需要 try_files 回落到 index.html，
#      否则刷新 /goods/list 这类地址会 404）；
#   2) 把后端请求反向代理到 backend 容器，使前端同源部署、
#      不依赖 CORS、也不需要在构建产物里写死后端地址。
# ============================================================================

upstream erp_backend {
    # docker-compose 里的服务名，由 Docker 内置 DNS 解析
    server backend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 上传的图片/附件可能较大（商品图、导入模板），放到 20M
    client_max_body_size 20m;

    # gzip：Vue 构建产物以文本为主，压缩后体积约为原来的 1/4
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 后端接口：按前缀整体转发 ----------
    # 业务表接口 /kuerp/、AI /ai/、登录 /auth/、系统 /system/、
    # 上传 /api/upload、静态资源 /uploads/、健康检查 /health
    location ~ ^/(kuerp|ai|auth|system|api|uploads|health)(/|$) {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        # 保留原始 Host 与客户端 IP，后端写操作日志时需要真实来源
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 流式输出（SSE）：关闭缓冲，否则前端要等整段返回才显示
        proxy_buffering off;
        proxy_cache off;
        # 大模型单次响应可能较慢，超时放宽到 5 分钟
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 静态资源长缓存 ----------
    # Vite 产物文件名带内容哈希，可放心缓存一年
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- SPA 路由回落 ----------
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，否则发版后用户仍加载旧入口
        add_header Cache-Control "no-cache";
    }
}
