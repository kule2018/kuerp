# ============================================================================
# 进销存 ERP 全栈一键编排（MySQL + NestJS 后端 + Vue3/Nginx 前端）
#
# 启动：docker compose up -d --build
# 访问：http://localhost:8080      （默认账号 admin / 123456）
# 后端直连：http://localhost:3000   （调试用，生产可注释掉端口映射）
#
# 与 nestjs-erp/docker-compose.yml 的分工：
#   - 本文件：完整生产形态（三个容器，前端 nginx 反代后端，前后端同源）
#   - nestjs-erp/docker-compose.yml：只起 MySQL，供本地 npm run start:dev 开发用
# ============================================================================

services:
  # ---------------------------- 数据库 ----------------------------
  mysql:
    image: mysql:5.7
    container_name: erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-kuerp_erp}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 关闭 ONLY_FULL_GROUP_BY：原系统大量报表 SQL 是 MySQL5.7 宽松写法，
      # 开启该模式会让汇总查询直接报错
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      # 仅本机可连，避免数据库端口暴露到公网
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动按文件名顺序导入建表脚本
      - ./nestjs-erp/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./nestjs-erp/db/ai-schema.sql:/docker-entrypoint-initdb.d/02-ai-schema.sql:ro
      - ./nestjs-erp/db/admin-schema.sql:/docker-entrypoint-initdb.d/03-admin-schema.sql:ro
      - ./nestjs-erp/db/rbac-schema.sql:/docker-entrypoint-initdb.d/04-rbac-schema.sql:ro
      - ./nestjs-erp/db/shop-schema.sql:/docker-entrypoint-initdb.d/05-shop-schema.sql:ro
      - ./nestjs-erp/db/extension-schema.sql:/docker-entrypoint-initdb.d/06-extension-schema.sql:ro
    healthcheck:
      # mysqladmin ping 只证明进程在；加上 -uroot -p 才是真的能登录
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - erp-net

  # ---------------------------- 后端 ----------------------------
  backend:
    build:
      context: ./nestjs-erp
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      # 全局前缀留空：业务接口路径与原系统保持一致（/kuerp/goods/index）
      GLOBAL_PREFIX: ""
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-kuerp_erp}
      DB_CHARSET: utf8mb4
      DB_SYNCHRONIZE: "false"
      # 生产必须覆盖：JWT_SECRET 决定 token 签名，用默认值等于没有鉴权
      JWT_SECRET: ${JWT_SECRET:-kuerp-nestjs-erp-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7200}
      AI_DEFAULT_BASE_URL: ${AI_DEFAULT_BASE_URL:-}
      AI_DEFAULT_API_KEY: ${AI_DEFAULT_API_KEY:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-deepseek-chat}
      # 进程内缓存参数（条目上限 / 默认 TTL 秒）
      CACHE_MAX: ${CACHE_MAX:-2000}
      CACHE_TTL: ${CACHE_TTL:-60}
      TZ: Asia/Shanghai
    volumes:
      # 上传文件独立于容器生命周期：重建镜像不丢商品图与附件
      - uploads-data:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        # 等 MySQL 真正可登录再启动，否则 TypeORM 首次连接必然失败并退出
        condition: service_healthy
    networks:
      - erp-net

  # ---------------------------- 前端 ----------------------------
  frontend:
    build:
      context: ./vue3-erp
      dockerfile: Dockerfile
      args:
        # 同源部署：baseURL 留空，请求走 nginx 反代
        VITE_API_BASE: ""
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - erp-net

volumes:
  mysql-data:
  uploads-data:

networks:
  erp-net:
    driver: bridge
