version: '3.8'
services:
  mysql:
    image: mysql:5.7
    container_name: kuerp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kuerp_erp
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql-data:/var/lib/mysql
      # 首次启动自动导入建表脚本（MySQL 官方镜像按文件名顺序执行 /docker-entrypoint-initdb.d/*.sql）
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/ai-schema.sql:/docker-entrypoint-initdb.d/02-ai-schema.sql:ro
      - ./db/admin-schema.sql:/docker-entrypoint-initdb.d/03-admin-schema.sql:ro
      - ./db/rbac-schema.sql:/docker-entrypoint-initdb.d/04-rbac-schema.sql:ro
      - ./db/shop-schema.sql:/docker-entrypoint-initdb.d/05-shop-schema.sql:ro
      # 扩展能力表：操作日志 / 消息中心 / 多级审批 / 定时任务日志
      - ./db/extension-schema.sql:/docker-entrypoint-initdb.d/06-extension-schema.sql:ro
